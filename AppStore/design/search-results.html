<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  html, body { width: 3840px; height: 2560px; }
  body {
    background:
      radial-gradient(1600px 1200px at 80% 15%, rgba(255, 201, 74, 0.18), transparent 60%),
      radial-gradient(1800px 1400px at 5% 110%, rgba(150, 60, 160, 0.5), transparent 65%),
      linear-gradient(160deg, #5B1A5D 0%, #3A0F3C 50%, #1C061E 100%);
  }
  .headline { position: absolute; left: 280px; top: 640px; width: 2200px; }
  .headline .eyebrow { font-size: 64px; padding: 26px 50px 26px 32px; gap: 28px; }
  .headline .eyebrow img { width: 80px; height: 80px; }
  .headline h1 { margin-top: 80px; font-size: 220px; line-height: 1.02; letter-spacing: -6px; }
  .pill { font-size: 80px; padding: 40px 90px 40px 46px; gap: 40px; }
  .pill img { width: 128px; height: 128px; }
  .pill small { font-size: 54px; }
  .check { width: 96px; height: 96px; }
  .check svg { width: 54px; height: 54px; }
</style>
<body><div class="grain"></div>
<div class="headline">
  <div class="eyebrow"><img src="burger.png">Status for Slack</div>
  <h1>Your Slack status,<br><em>on your wrist.</em></h1>
</div>
<div class="watch" style="left:2420px;top:640px;width:1060px;height:1404px">
  <div class="band top"></div><div class="band bottom"></div>
  <div class="case"><div class="screen"><img src="../raw/watch-presets.png"></div></div>
  <div class="crown"></div><div class="button"></div>
</div>
<div class="pill" style="left:1900px;top:1850px"><img src="burger.png"><div>Lunch<small>Clears in 1 hour</small></div><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
</body>
