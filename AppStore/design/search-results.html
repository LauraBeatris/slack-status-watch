<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  html, body { width: 3840px; height: 2560px; }
  .headline { position: absolute; left: 280px; top: 820px; width: 2000px; }
  .headline .eyebrow { font-size: 64px; padding: 24px 54px 24px 24px; gap: 30px; }
  .headline .eyebrow img { width: 100px; height: 100px; }
  .headline h1 { margin-top: 80px; font-size: 220px; }
  .showcase { left: 2120px; right: 160px; top: 200px; bottom: 200px; border-radius: 140px; }
  .pill { font-size: 80px; padding: 40px 90px 40px 46px; gap: 40px; }
  .pill img { width: 128px; height: 128px; }
  .pill small { font-size: 54px; }
  .check { width: 96px; height: 96px; }
  .check svg { width: 54px; height: 54px; }
</style>
<body>
<div class="headline">
  <div class="eyebrow"><img src="icon.png">Status for Slack</div>
  <h1>Your Slack status,<br><em>on your wrist.</em></h1>
</div>
<div class="showcase">
  <div class="watch" style="left:330px;top:600px;width:900px;height:1062px">
    <div class="band top"></div><div class="band bottom"></div>
    <div class="case"><div class="screen"><img src="../raw/watch-presets.png"></div></div>
    <div class="crown"></div><div class="button"></div>
  </div>
  <div class="pill" style="left:50%;transform:translateX(-50%);top:300px"><img src="burger.png"><div>Lunch<small>Clears in 1 hour</small></div><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
</div>
</body>
