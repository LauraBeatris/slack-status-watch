<!doctype html><meta charset="utf-8">
<!--
  A short clip for social posts: a link is typed into a chat, sent, and its preview
  unfurls and plays the landing page's og:video. The chat app is made up.

  It plays the 4K render of the share card, so make that first:
    node Scripts/render-og-video.mjs --width 3840 --out AppStore/promo/og-3840x2016.mp4
  then render this:
    node Scripts/render-og-video.mjs --page AppStore/design/og-demo.html --width 3840 --out AppStore/promo/og-video-demo.mp4

  Everything on screen is a function of one time, seek(ms), so the renderer can step
  through it frame by frame. Opened in a browser it plays on its own.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 640px at 82% 6%, rgba(255, 201, 74, .16), transparent 60%),
      radial-gradient(1000px 800px at 6% 108%, rgba(150, 60, 160, .5), transparent 65%),
      linear-gradient(160deg, #5b1a5d 0%, #3a0f3c 50%, #1c061e 100%);
  }
  .grain { position: absolute; inset: 0; opacity: .05; background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 4px 4px; }

  .camera { position: absolute; inset: 0; }
  .window {
    position: absolute; left: 460px; top: 96px; width: 1000px; height: 888px;
    display: flex; flex-direction: column; overflow: hidden;
    border-radius: 34px; background: #151517;
    box-shadow: 0 60px 140px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255, 255, 255, .08);
  }

  .header { flex: none; display: flex; align-items: center; gap: 14px; height: 84px; padding: 0 28px; border-bottom: 1px solid rgba(255, 255, 255, .07); }
  .lights { display: flex; gap: 9px; margin-right: 18px; }
  .lights i { width: 13px; height: 13px; border-radius: 50%; background: #3a3a3d; }
  .avatar { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(140deg, #ffb36b, #e0569b); font-weight: 700; font-size: 20px; }
  .who b { display: block; font-size: 19px; font-weight: 600; }
  .who small { font-size: 15px; color: #8e8e93; }

  .messages { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 28px 18px; overflow: hidden; }
  /* A slot reserves the space a message takes, so arriving messages push the thread up */
  .slot { flex: none; overflow: visible; }
  .slot > .inner { padding-top: 12px; display: flex; }
  .slot.out > .inner { justify-content: flex-end; }
  .bubble { max-width: 640px; padding: 13px 20px; border-radius: 26px; font-size: 23px; line-height: 1.3; }
  .in .bubble { background: #2c2c2e; transform-origin: 0 100%; }
  .out .bubble { background: #ffc94a; color: #1d1d1f; font-weight: 500; transform-origin: 100% 100%; }
  .out .bubble u { text-underline-offset: 4px; text-decoration-thickness: 1.5px; }

  .card { width: 640px; overflow: hidden; border-radius: 24px; background: #2c2c2e; transform-origin: 100% 0; }
  .media { position: relative; width: 640px; height: 336px; background: #232325; }
  .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shimmer { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .07) 50%, transparent 70%) no-repeat; background-size: 200% 100%; }
  .meta { padding: 16px 22px 18px; }
  .meta b { display: block; font-size: 20px; font-weight: 600; line-height: 1.3; }
  .meta small { display: block; margin-top: 4px; font-size: 17px; color: #8e8e93; }

  .composer { flex: none; display: flex; align-items: center; gap: 14px; height: 96px; padding: 0 24px 0 28px; border-top: 1px solid rgba(255, 255, 255, .07); }
  .field { position: relative; flex: 1; display: flex; align-items: center; height: 56px; padding: 0 22px; border-radius: 28px; background: #232325; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); font-size: 22px; white-space: nowrap; }
  .placeholder { position: absolute; left: 22px; color: #6e6e73; }
  .caret { display: inline-block; width: 2.5px; height: 28px; margin-left: 1px; border-radius: 2px; background: #ffc94a; }
  .send { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #3a3a3d; }
  .send svg { width: 24px; height: 24px; fill: none; stroke: #1d1d1f; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
<body><div class="grain"></div>
<div class="camera">
  <div class="window">
    <div class="header">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="avatar">S</div>
      <div class="who"><b>Sam</b><small>Active now</small></div>
    </div>

    <div class="messages">
      <div class="slot in"><div class="inner"><div class="bubble">how's the watch app going?</div></div></div>
      <div class="slot in" id="ask"><div class="inner"><div class="bubble">got a link? 👀</div></div></div>
      <div class="slot out" id="link"><div class="inner"><div class="bubble"><u>status-for-slack.vercel.app</u></div></div></div>
      <div class="slot out" id="preview"><div class="inner">
        <div class="card">
          <div class="media"><video muted playsinline preload="auto" src="../promo/og-3840x2016.mp4"></video><div class="shimmer"></div></div>
          <div class="meta"><b>Status for Slack: your Slack status, on your wrist</b><small>status-for-slack.vercel.app</small></div>
        </div>
      </div></div>
      <div class="slot in" id="reply"><div class="inner"><div class="bubble">wait, the preview moves?? 🤯</div></div></div>
    </div>

    <div class="composer">
      <div class="field"><span class="placeholder">Message</span><span class="typed"></span><span class="caret"></span></div>
      <div class="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></div>
    </div>
  </div>
</div>

<script>
  const DURATION = 13000;
  const TYPED = 'status-for-slack.vercel.app';
  const VIDEO_STARTS = 4650;

  const $ = (s) => document.querySelector(s);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const at = (t, start, length) => clamp((t - start) / length);
  /* Close to cubic-bezier(.23, 1, .32, 1), the curve the landing page uses */
  const out = (x) => 1 - Math.pow(1 - x, 5);
  const inOut = (x) => (x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2);
  const mix = (a, b, k) => a + (b - a) * k;

  /* Keystrokes land a little unevenly, the way a person types */
  const KEYS = [...TYPED].map((_, i) => 1750 + i * 50 + (((i * 37) % 7) - 3) * 7);
  const SENT = 3700;

  const camera = $('.camera'), win = $('.window');
  const typed = $('.typed'), placeholder = $('.placeholder'), caret = $('.caret'), send = $('.send');
  const video = $('video'), shimmer = $('.shimmer');
  const slots = {
    ask: { el: $('#ask'), at: 900 },
    link: { el: $('#link'), at: SENT },
    preview: { el: $('#preview'), at: 4050, length: 520 },
    reply: { el: $('#reply'), at: 10650 },
  };
  for (const slot of Object.values(slots)) slot.height = slot.el.offsetHeight;

  function message({ el, at: start, height, length = 380 }, t) {
    const k = out(at(t, start, length));
    el.style.height = `${height * k}px`;
    const body = el.querySelector('.bubble, .card');
    body.style.opacity = clamp(k * 1.6);
    body.style.transform = `translateY(${(1 - k) * 12}px) scale(${mix(.94, 1, k)})`;
  }

  /* The point the camera pushes in on: the middle of the preview, once it has unfurled */
  let focus = '50% 50%';

  function draw(t) {
    const enter = out(at(t, 0, 800));
    const leave = inOut(at(t, DURATION - 650, 650));
    win.style.opacity = enter * (1 - leave);
    win.style.transform = `translateY(${(1 - enter) * 36 - leave * 16}px) scale(${mix(.975, 1, enter)})`;

    for (const slot of Object.values(slots)) message(slot, t);

    const count = t < SENT ? KEYS.filter((k) => t >= k).length : 0;
    typed.textContent = TYPED.slice(0, count);
    placeholder.style.opacity = count ? 0 : 1;
    const typing = t >= KEYS[0] - 200 && t < SENT;
    caret.style.opacity = t >= 1450 && t < SENT && (typing || Math.floor((t - 1450) / 530) % 2 === 0) ? 1 : 0;
    const ready = count > 0;
    const press = t >= SENT - 120 && t < SENT + 60;
    send.style.background = ready ? '#ffc94a' : '#3a3a3d';
    send.style.transform = `scale(${press ? .88 : 1})`;

    /* A beat of shimmer while the preview loads, then the video fades up over it */
    shimmer.style.backgroundPosition = `${mix(160, -60, ((t - 4050) % 900) / 900)}% 0`;
    shimmer.style.opacity = 1 - at(t, VIDEO_STARTS, 250);
    video.style.opacity = at(t, VIDEO_STARTS - 50, 300);

    const push = inOut(at(t, 5200, 2800)) * (1 - inOut(at(t, 9700, 900)));
    camera.style.transformOrigin = focus;
    camera.style.transform = `scale(${mix(1, 1.28, push)})`;
  }

  function videoTime(t) {
    return Math.max(0, t - VIDEO_STARTS) / 1000 % (video.duration || 6);
  }

  /* The renderer calls this for each frame. It waits until the video shows that exact frame. */
  let driven = false;
  window.DURATION = DURATION;
  window.seek = (t) => {
    driven = true;
    video.pause();
    draw(t);
    const target = videoTime(t);
    if (Math.abs(video.currentTime - target) < 1e-4) return Promise.resolve();
    return new Promise((done) => {
      video.addEventListener('seeked', () => done(), { once: true });
      video.currentTime = target;
    });
  };

  window.ready = Promise.all([
    document.fonts.ready,
    new Promise((done) => (video.readyState >= 2 ? done() : video.addEventListener('loadeddata', done, { once: true }))),
  ]).then(() => {
    draw(9000);
    const card = $('.card').getBoundingClientRect();
    focus = `${card.left + card.width / 2}px ${card.top + card.height / 2}px`;
    draw(0);
  });

  /* Opened in a browser, it plays itself on a loop */
  window.ready.then(() => {
    const start = performance.now();
    const frame = (now) => {
      if (driven) return;
      const t = (now - start) % DURATION;
      draw(t);
      if (t < VIDEO_STARTS) { video.pause(); video.currentTime = 0; }
      else if (video.paused) { video.currentTime = videoTime(t); video.play(); }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
</script>
</body>
