<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  html, body { width: 3840px; height: 1646px; }
  body {
    background:
      radial-gradient(1400px 1000px at 78% 20%, rgba(255, 201, 74, 0.18), transparent 60%),
      radial-gradient(1600px 1200px at 10% 110%, rgba(150, 60, 160, 0.5), transparent 65%),
      linear-gradient(160deg, #5B1A5D 0%, #3A0F3C 50%, #1C061E 100%);
  }
  .headline { position: absolute; left: 300px; top: 330px; width: 1700px; }
  .headline h1 { margin-top: 56px; font-size: 168px; letter-spacing: -4px; }
  .headline p { margin-top: 44px; font-size: 62px; line-height: 1.3; color: rgba(255,255,255,.72); font-weight: 500; }
  .pill { font-size: 56px; padding: 30px 64px 30px 34px; }
  .pill img { width: 88px; height: 88px; }
  .pill small { font-size: 38px; }
  .pill.dim { background: rgba(255,255,255,.16); color: #fff; box-shadow: none; border: 2px solid rgba(255,255,255,.22); backdrop-filter: blur(20px); }
  .pill.dim small { color: rgba(255,255,255,.65); }
  .emoji { width: 88px; height: 88px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-size: 50px; }
</style>
<body><div class="grain"></div>
<div class="headline">
  <div class="eyebrow"><img src="burger.png">Status for Slack</div>
  <h1>Your Slack status,<br><em>on your wrist.</em></h1>
  <p>One tap on your Apple Watch. Clears itself when you're done.</p>
</div>
<div class="watch" style="left:2420px;top:420px;width:760px;height:1006px">
  <div class="band top"></div><div class="band bottom"></div>
  <div class="case"><div class="screen"><img src="../raw/watch-presets.png"></div></div>
  <div class="crown"></div><div class="button"></div>
</div>
<div class="pill" style="left:2900px;top:300px"><img src="burger.png"><div>Lunch<small>Clears in 1 hour</small></div><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
<div class="pill dim" style="left:2020px;top:1080px"><div>In a meeting<small>Clears in 1 hour</small></div></div>
<div class="pill dim" style="left:3120px;top:1180px"><div>Focusing<small>Clears in 2 hours</small></div></div>
</body>
