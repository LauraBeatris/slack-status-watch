<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  html, body { width: 3840px; height: 1646px; }
  .headline { position: absolute; left: 300px; top: 470px; width: 1760px; }
  .headline h1 { margin-top: 56px; font-size: 168px; }
  .headline p { margin-top: 44px; font-size: 62px; line-height: 1.35; color: var(--muted); }
  /* The watch sits in the showcase card, which clips its band the way the landing page's does */
  .showcase { left: 2140px; right: 160px; top: 140px; bottom: 140px; border-radius: 120px; }
  .pill { font-size: 56px; padding: 30px 64px 30px 34px; }
  .pill img { width: 88px; height: 88px; }
  .pill small { font-size: 38px; }
  .pill.dim { background: rgba(255,255,255,.82); color: #4a3b4f; box-shadow: 0 30px 70px rgba(60,20,70,.12); backdrop-filter: blur(24px); }
  .pill.dim small { color: #8a7a8f; }
  .emoji { font-size: 70px; line-height: 88px; width: 88px; text-align: center; }
</style>
<body>
<div class="headline">
  <div class="eyebrow"><img src="icon.png">Status for Slack</div>
  <h1>Your Slack status,<br><em>on your wrist.</em></h1>
  <p>One tap on your Apple Watch. Clears itself when you're done.</p>
</div>
<div class="showcase">
  <div class="watch" style="left:420px;top:330px;width:700px;height:826px">
    <div class="band top"></div><div class="band bottom"></div>
    <div class="case"><div class="screen"><img src="../raw/watch-presets.png"></div></div>
    <div class="crown"></div><div class="button"></div>
  </div>
  <div class="pill" style="left:50%;transform:translateX(-50%);top:190px"><img src="burger.png"><div>Lunch<small>Clears in 1 hour</small></div><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
  <div class="pill dim" style="left:40px;top:960px"><span class="emoji">📅</span><div>In a meeting<small>Clears in 1 hour</small></div></div>
  <div class="pill dim" style="right:40px;top:1080px"><span class="emoji">🎧</span><div>Focusing<small>Clears in 2 hours</small></div></div>
</div>
</body>
