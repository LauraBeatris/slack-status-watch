name: Status
options:
  bundleIdPrefix: com.laurabeatris
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SlackStatusKit:
    path: Packages/SlackStatusKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SLACK_CLIENT_ID: "3972288438658.12386965455574"
    SLACK_OAUTH_REDIRECT_URL: https://status-for-slack.vercel.app/api/slack/callback
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Status:
    type: application
    platform: iOS
    sources: [Apps/Phone, Apps/Shared]
    dependencies:
      - package: SlackStatusKit
      - target: StatusWatch
    info:
      path: Apps/Phone/Info.plist
      properties:
        CFBundleDisplayName: Status
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.laurabeatris.slackstatus
            CFBundleURLSchemes: [statusforslack]
        SlackClientID: $(SLACK_CLIENT_ID)
        SlackOAuthRedirectURL: $(SLACK_OAUTH_REDIRECT_URL)
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.laurabeatris.slackstatus
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  StatusWatch:
    type: application
    platform: watchOS
    sources: [Apps/Watch, Apps/Shared]
    dependencies:
      - package: SlackStatusKit
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: Status
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.laurabeatris.slackstatus
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.laurabeatris.slackstatus.watchkitapp
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
